<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - WHEELS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <style>
        body {
            padding-top: 0;
            background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.12) 0%, var(--primary) 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .register-card {
            max-width: 520px;
            width: 100%;
            background: var(--subtle);
            border: 1px solid var(--extra);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }
            .register-card {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <a href="index.html" class="logo" style="font-size: 1.6rem; text-decoration: none; color: #fff; display: inline-block; margin-bottom: 0.5rem;">WHEELS</a>
            <h1 style="font-size: 1.5rem; margin: 0 0 4px;">Create Membership Account</h1>
            <p style="color: var(--accent); font-size: 0.85rem; margin: 0;">Unlock vehicle configurators, reservation deposits, and order timelines.</p>
        </div>

        <form id="register-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
            <div class="form-group">
                <label style="font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); margin-bottom: 4px; text-align: left; display: block;">Full Legal Name</label>
                <input type="text" id="reg-name" required placeholder="Marcus Sterling" style="width: 100%; padding: 12px; background: var(--primary); border: 1px solid var(--extra); color: #fff; border-radius: 8px;">
            </div>

            <div class="form-group">
                <label style="font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); margin-bottom: 4px; text-align: left; display: block;">Email Address</label>
                <input type="email" id="reg-email" required placeholder="buyer@domain.com" style="width: 100%; padding: 12px; background: var(--primary); border: 1px solid var(--extra); color: #fff; border-radius: 8px;">
            </div>

            <div class="form-group">
                <label style="font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); margin-bottom: 4px; text-align: left; display: block;">Account Role</label>
                <select id="reg-role" style="width: 100%; padding: 12px; background: var(--primary); border: 1px solid var(--extra); color: #fff; border-radius: 8px;">
                    <option value="customer">VIP Buyer (Track Orders & Test Drives)</option>
                    <option value="admin">Dealership Staff / Admin (Manage Fleet & Orders)</option>
                </select>
            </div>

            <div class="form-group">
                <label style="font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); margin-bottom: 4px; text-align: left; display: block;">Password</label>
                <input type="password" id="reg-password" required placeholder="••••••••" value="password123" style="width: 100%; padding: 12px; background: var(--primary); border: 1px solid var(--extra); color: #fff; border-radius: 8px;">
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 0.5rem;">
                <i class="fas fa-user-plus"></i> Complete Registration
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--accent);">
            Already have an account? <a href="login.html" style="color: var(--secondary); font-weight: 700; text-decoration: none;">Sign In</a>
        </div>
        <div style="text-align: center; margin-top: 0.8rem;">
            <a href="index.html" style="color: var(--accent); font-size: 0.8rem; text-decoration: none;"><i class="fas fa-arrow-left"></i> Return to Showroom</a>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/car-db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('reg-name').value;
                const email = document.getElementById('reg-email').value;
                const role = document.getElementById('reg-role').value;
                const password = document.getElementById('reg-password').value;

                const user = window.authManager.register(name, email, password, role);
                showToast(`Welcome to Wheels, ${user.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 700);
            });
        });
    </script>
</body>
</html>
