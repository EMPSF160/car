<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - WHEELS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <style>
        body {
            padding-top: 0;
            background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.12) 0%, var(--primary) 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-card {
            max-width: 480px;
            width: 100%;
            background: var(--subtle);
            border: 1px solid var(--extra);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        .quick-demo-box {
            background: var(--primary);
            border: 1px dashed var(--secondary);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .quick-demo-btn {
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <a href="index.html" class="logo" style="font-size: 1.6rem; text-decoration: none; color: #fff; display: inline-block; margin-bottom: 0.5rem;">WHEELS</a>
            <h1 style="font-size: 1.5rem; margin: 0 0 4px;">Sign In to Your Account</h1>
            <p style="color: var(--accent); font-size: 0.85rem; margin: 0;">Access vehicle orders, test drives, and dealership controls.</p>
        </div>

        <!-- 1-Click Demo Login Shortcuts -->
        <div class="quick-demo-box">
            <span style="font-size: 0.75rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); letter-spacing: 0.5px; display: block; margin-bottom: 6px;">
                ⚡ Fast 1-Click Demo Accounts:
            </span>
            <div style="display: flex; justify-content: center; gap: 0.5rem;">
                <button type="button" class="btn quick-demo-btn" id="demo-admin-btn">
                    <i class="fas fa-user-shield"></i> Dealership Admin
                </button>
                <button type="button" class="btn btn-secondary quick-demo-btn" id="demo-cust-btn">
                    <i class="fas fa-user"></i> VIP Buyer
                </button>
            </div>
        </div>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
            <div class="form-group">
                <label style="font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); margin-bottom: 4px; text-align: left; display: block;">Email Address</label>
                <input type="email" id="login-email" required placeholder="admin@wheels.com or buyer@domain.com" style="width: 100%; padding: 12px; background: var(--primary); border: 1px solid var(--extra); color: #fff; border-radius: 8px;">
            </div>

            <div class="form-group">
                <label style="font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-family: var(--font-accent); margin-bottom: 4px; text-align: left; display: block;">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" value="demo1234" style="width: 100%; padding: 12px; background: var(--primary); border: 1px solid var(--extra); color: #fff; border-radius: 8px;">
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 0.5rem;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--accent);">
            Don't have an account? <a href="register.html" style="color: var(--secondary); font-weight: 700; text-decoration: none;">Create an Account</a>
        </div>
        <div style="text-align: center; margin-top: 0.8rem;">
            <a href="index.html" style="color: var(--accent); font-size: 0.8rem; text-decoration: none;"><i class="fas fa-arrow-left"></i> Return to Showroom</a>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/car-db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');

            document.getElementById('demo-admin-btn').addEventListener('click', () => {
                emailInput.value = 'admin@wheels.com';
                passwordInput.value = 'admin123';
                window.authManager.loginAsDemo('admin');
                showToast('Signed in as Dealership Admin (Alex Vance)', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 600);
            });

            document.getElementById('demo-cust-btn').addEventListener('click', () => {
                emailInput.value = 'customer@wheels.com';
                passwordInput.value = 'cust123';
                window.authManager.loginAsDemo('customer');
                showToast('Signed in as VIP Buyer (Marcus Sterling)', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 600);
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const user = window.authManager.login(emailInput.value, passwordInput.value);
                showToast(`Welcome back, ${user.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            });
        });
    </script>
</body>
</html>
